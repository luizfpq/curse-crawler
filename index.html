<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Cursos Unificado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .course-card { transition: transform 0.2s, box-shadow 0.2s; }
        .course-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-7xl mx-auto mb-12 text-center">
        <h1 class="text-4xl font-bold text-slate-800 mb-2">Guia Unificado de Cursos</h1>
        <p class="text-slate-500">Dados carregados dinamicamente da pasta ./json</p>
    </header>

    <main class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
    <div class="text-left">
        <h1 class="text-4xl font-bold text-slate-800 mb-2">Guia Unificado de Cursos</h1>
        <p class="text-slate-500 italic" id="lastUpdate">Aguardando atualização...</p>
    </div>
    <button id="updateBtn" onclick="runUpdate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition flex items-center gap-2">
        <svg id="updateIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Atualizar Scrapers
    </button>
</div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Busca Geral</label>
                <input type="text" id="searchInput" placeholder="Filtre por curso, campus, nível ou IF..." 
                    class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="w-full md:w-48">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Instituição</label>
                <select id="originFilter" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none">
                    <option value="all">Todas</option>
                    <option value="IFRS">IFRS</option>
                    <option value="IFSP">IFSP</option>
                </select>
            </div>
        </div>

        <div id="stats" class="mb-6 text-sm text-slate-600 font-medium italic text-center md:text-left">Carregando cursos...</div>
        <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        let allCourses = [];
        const grid = document.getElementById('coursesGrid');
        const searchInput = document.getElementById('searchInput');
        const originFilter = document.getElementById('originFilter');
        const stats = document.getElementById('stats');

        async function loadCourses() {
            try {
                const response = await fetch('/api/courses');
                allCourses = await response.json();
                renderCourses();
            } catch (error) {
                stats.innerText = "Erro ao carregar dados dos arquivos JSON.";
                console.error(error);
            }
        }

        function renderCourses() {
            const filterText = searchInput.value.toLowerCase();
            const filterOrigin = originFilter.value;

            const filtered = allCourses.filter(c => {
                const matchesSearch = c.title.toLowerCase().includes(filterText) || 
                                     c.campus.toLowerCase().includes(filterText) ||
                                     c.level.toLowerCase().includes(filterText);
                const matchesOrigin = filterOrigin === 'all' || c.origin === filterOrigin;
                return matchesSearch && matchesOrigin;
            });

            stats.innerText = `Mostrando ${filtered.length} cursos encontrados.`;
            grid.innerHTML = filtered.map(course => `
                <div class="course-card bg-white p-6 rounded-2xl shadow-sm border-l-4 ${course.color} flex flex-col justify-between border border-slate-100">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="px-2 py-1 bg-slate-100 text-slate-600 text-[10px] font-bold rounded uppercase tracking-wider">${course.origin}</span>
                            <span class="text-[10px] text-slate-400 font-semibold uppercase">${course.modality}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 leading-tight mb-2">${course.title}</h3>
                        <p class="text-sm text-slate-500 mb-1"><strong>Campus:</strong> ${course.campus}</p>
                        <p class="text-xs text-slate-400 mb-4 italic line-clamp-1">${course.level}</p>
                    </div>
                    <div class="mt-auto">
                        <div class="text-xs text-slate-600 mb-4 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            ${course.details}
                        </div>
                        <a href="${course.url}" target="_blank" class="block text-center w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold py-2 rounded-lg transition">
                            Acessar página
                        </a>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', renderCourses);
        originFilter.addEventListener('change', renderCourses);

        loadCourses();

        async function runUpdate() {
    const btn = document.getElementById('updateBtn');
    const icon = document.getElementById('updateIcon');
    const statusText = document.getElementById('lastUpdate');
    
    // UI Feedback
    btn.disabled = true;
    btn.classList.add('opacity-50', 'cursor-not-allowed');
    icon.classList.add('animate-spin');
    statusText.innerText = "Executando crawlers... isso pode levar alguns segundos.";

    try {
        const response = await fetch('/api/update');
        const data = await response.json();
        
        console.table(data.summary);
        statusText.innerText = "Atualização concluída com sucesso!";
        
        // Recarrega os dados no grid
        await loadCourses();
    } catch (error) {
        statusText.innerText = "Erro ao processar atualização.";
    } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        icon.classList.remove('animate-spin');
    }
}
    </script>
</body>
</html>
